<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Golden Legacy General Merchandise</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="role-switcher"><button class="active" onclick="switchRole('customer',this)">Customer</button><button onclick="switchRole('admin',this)">Admin</button><button onclick="switchRole('staff',this)">Staff</button></div>
<section id="customer" class="view active">
<header class="top"><div class="brand"><b>◆ GOLDEN LEGACY</b><small>GENERAL MERCHANDISE</small></div><div class="search"><input id="search" placeholder="Search for Softdrinks and Beer..."><button onclick="searchProducts()">⌕</button></div><div class="actions"><button onclick="page('cart')">🛒 Cart <b id="cartCount">0</b></button><button onclick="notify()">🔔 Notifications</button><button onclick="profile()">● Juan Dela Cruz</button></div></header>
<nav><button onclick="page('home')">⌂ Home</button><button onclick="browse('Softdrinks')">🥤 Softdrinks</button><button onclick="browse('Beer')">🍺 Beer</button></nav>
<main id="customerContent"></main>
</section>
<section id="admin" class="view"><aside><div class="side-brand">◆ GOLDEN LEGACY<small>GENERAL MERCHANDISE</small></div><div id="adminMenu"></div><div class="help"><b>Need Help?</b><p>Our support team is ready to help you.</p><button onclick="notify()">Contact Support</button></div></aside><div class="admin-main"><header class="admin-head"><h1 id="adminTitle">Dashboard</h1><input placeholder="Search Anything..."></header><main id="adminContent"></main></div></section>
<section id="staff" class="view"><header class="staff-head"><div class="brand"><b>◆ GOLDEN LEGACY</b><small>GENERAL MERCHANDISE</small></div><input placeholder="Search for Anything..."><div><button onclick="staff('duty')">Duty Clock</button><button onclick="staff('commission')">Commission</button><button onclick="notify()">● Notifications</button></div></header><main id="staffContent"></main></section>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>
<script src="script.js"></script>
</body></html>
