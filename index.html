<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Merchander – online wholesale ordering for Golden Legacy General Merchandise, Caloocan City.">
  <title>Merchander – Golden Legacy General Merchandise</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307182a'/%3E%3Cpath d='M16 5l9 11-9 11-9-11z' fill='%23e8b923'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('merchander.session') || 'null');
      var u = s && (JSON.parse(localStorage.getItem('merchander.users') || '[]').find(function (x) { return x.id === s.userId; }));
      document.documentElement.dataset.theme = (u && u.prefs && u.prefs.theme) || JSON.parse(localStorage.getItem('merchander.theme') || '"light"');
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand" aria-label="Golden Legacy home">
        <svg viewBox="0 0 32 32" width="36" height="36" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#07182a"/><path d="M16 5l9 11-9 11-9-11z" fill="#e8b923"/></svg>
        <span><strong>GOLDEN LEGACY</strong><small>General Merchandise</small></span>
      </a>
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch theme">☾</button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><strong>Merchander</strong> · Ordering platform for Golden Legacy General Merchandise, Caloocan City</p>
      <p class="small">Sprint 1 prototype · <button id="resetDemo" class="link small" type="button">Reset demo data</button></p>
    </div>
  </footer>

  <div id="inbox" class="inbox" aria-live="polite" aria-label="Simulated SMS and email messages"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal" class="modal" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
